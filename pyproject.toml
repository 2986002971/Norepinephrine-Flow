[project]
name = "norepinephrine-flow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ogbench>=1.1.5",
    "jax[cuda12]>=0.8.0",
    "flax>=0.12.0",
    "distrax>=0.1.7",
    "ml_collections",
    "wandb",
    "matplotlib",
    "moviepy",
    "pyvirtualdisplay>=3.0",
    "pytest>=9.0.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]   
